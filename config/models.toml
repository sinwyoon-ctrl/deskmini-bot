[gemini]
adapter = "gemini_rest"
# "auto" = ~/.config/ione/model_ladder.json 사다리. 특정 모델명을 쓰면 그 모델만 사용한다.
model = "auto"

[claude]
model = "sonnet"
effort = "medium"
tools = ["Read", "Edit", "Write", "Glob", "Grep"]

# 대화 응답층. 앞 순서부터 시도한다. claude 는 ANTHROPIC_API_KEY 가 env 파일에 있을 때만 시도한다.
[chat]
providers = ["claude", "gemini"]
model = "claude-sonnet-5-5"
effort = "low"
max_tokens = 2000
timeout_seconds = 60
history_turns = 10
